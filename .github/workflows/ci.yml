# CI : unitaires (sans build ni navigateur), export statique, métadonnées,
# puis suite navigateur (harnais du moteur de filigrane + fumée UI).
# Sur un push vers main, si tout est vert : déploiement sur Cloudflare Pages
# de l'export EXACT qui a été testé (artefact), jamais d'un rebuild. Ce même
# export est publié en image Docker (ghcr.io) sur main et sur les tags v*.
#
# Navigateurs : playwright-core est une simple bibliothèque (le runner reste
# bun:test) ; `bunx playwright-core install --with-deps <navigateur>` peuple
# son registre (~/.cache/ms-playwright). Sur le runner GitHub, ni CHROMIUM_EXE
# ni /opt/pw-browsers n'existent : e2e/helpers/browser.ts retombe donc sur ce
# registre. Chromium est bloquant ; Firefox et WebKit tournent en matrice non
# bloquante (continue-on-error), la couverture y est identique sauf le test
# presse-papiers, sauté hors Chromium (grantPermissions non supporté).

name: CI

on:
  push:
    branches: [main]
    # Une version taguée (v1.2.3) publie l'image Docker sous ce numéro ;
    # elle ne redéploie pas le site.
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Audit hebdomadaire : une CVE publiée sur une dépendance doit faire
  # rougir la CI même sans nouveau commit.
  schedule:
    - cron: "0 6 * * 1"
  # Lancement manuel (onglet Actions → CI → Run workflow) : rejoue toute la
  # suite et, sur main, republie le site si la case est cochée. Les tests
  # restent obligatoires : on ne publie jamais un export non testé.
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publier sur cachety.com après les tests (branche main seulement)"
        type: boolean
        default: true

# Moindre privilège : la CI ne fait que lire le dépôt. Les actions tierces
# sont épinglées par SHA de commit (une étiquette peut être déplacée).
permissions:
  contents: read

jobs:
  test:
    name: Unitaires + navigateur (Chromium)
    runs-on: ubuntu-latest
    # Durée habituelle : 10 min. Une page bloquée ne doit pas tenir la file 6 h.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node épinglé (.nvmrc) : next build tourne sous Node, en même version
      # majeure partout (poste de dev, CI) et alignée sur @types/node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2" # épinglée : même chaîne d'outils partout

      - name: Dépendances
        run: bun install --frozen-lockfile

      - name: Audit des dépendances (CVE connues)
        run: bun audit

      # Avant le build : garantit que `bun test` reste vert sur un arbre nu
      # (les tests de métadonnées se sautent proprement sans out/).
      - name: Tests unitaires
        run: bun test

      # Typage de tout le dépôt (scripts et tests compris), pas seulement de
      # l'application que next build vérifie.
      - name: Typage
        run: bunx tsc --noEmit -p .

      - name: Export statique
        run: bun run build

      - name: Métadonnées et sécurité de l'export (CSP hachée, aucune ressource externe)
        run: bun test ./e2e/site-meta.static.test.ts ./e2e/security.static.test.ts

      - name: Chromium (registre playwright-core)
        run: bunx playwright-core install --with-deps chromium

      - name: Suite navigateur
        run: bun run test:e2e

      # L'export testé ci-dessus, transmis tel quel aux jobs de déploiement
      # et d'image Docker.
      - name: Export testé (artefact)
        if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  browsers:
    # WebKit bloquant : c'est le moteur (Safari/iOS) où canvas et pdf.js
    # cassent en premier. Firefox reste indicatif.
    name: Suite navigateur (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Durée habituelle : 10 min (Firefox), 25 min (WebKit). Sans limite, une
    # page bloquée pour de bon tient la tâche 6 h (vu le 2026-11-25, v1.2.1).
    timeout-minutes: 60
    continue-on-error: ${{ matrix.browser == 'firefox' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node épinglé (.nvmrc) : next build tourne sous Node, en même version
      # majeure partout (poste de dev, CI) et alignée sur @types/node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2" # épinglée : même chaîne d'outils partout

      - name: Dépendances
        run: bun install --frozen-lockfile

      - name: Export statique
        run: bun run build

      - name: Navigateur (registre playwright-core)
        run: bunx playwright-core install --with-deps ${{ matrix.browser }}

      - name: Suite navigateur
        run: bun run test:e2e
        env:
          BROWSER: ${{ matrix.browser }}

  deploy:
    # Un push sur main, ou un lancement manuel sur main (case « Publier »
    # cochée), après les suites bloquantes (Chromium et WebKit). Ni le
    # planning hebdomadaire ni une PR ne déploient.
    name: Déploiement (Cloudflare Pages)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: [test, browsers]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cachety.com
    # Un seul déploiement à la fois ; le plus récent l'emporte.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node épinglé (.nvmrc) : next build tourne sous Node, en même version
      # majeure partout (poste de dev, CI) et alignée sur @types/node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2" # épinglée : même chaîne d'outils partout

      # Wrangler est une devDependency épinglée par le lockfile : pas de
      # téléchargement « latest » au moment de déployer.
      - name: Dépendances
        run: bun install --frozen-lockfile

      - name: Export testé
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out/

      - name: Publication
        run: bunx wrangler pages deploy out --project-name cachety --branch main --commit-hash "$GITHUB_SHA"
        env:
          # Jeton API Cloudflare limité à « Cloudflare Pages : Edit » sur ce compte.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  image:
    # Image Docker pour un usage local (docker run -p 8000:8080 …), publiée
    # sur ghcr.io après les suites bloquantes. Elle embarque l'export EXACT
    # qui a été testé : --build-context site=./out remplace l'étape de build
    # du Dockerfile. Push sur main → « edge » ; tag v1.2.3 → 1.2.3, 1.2, 1,
    # latest.
    name: Image Docker (ghcr.io)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Une publication à la fois par ref : deux push rapprochés sur main ne
    # peuvent pas finir dans le désordre et laisser « edge » sur l'ancien.
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # Attestation de provenance (Sigstore, OIDC).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export testé
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out/

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Étiquettes et métadonnées
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Annotations aussi sur l'index multi-architecture : c'est lui que
          # ghcr.io affiche (description, licence).
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha
          labels: |
            org.opencontainers.image.title=Cachety
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            org.opencontainers.image.title=Cachety
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Avant toute publication : l'image sert bien le site (pages sans
      # « .html », worker pdf.js en JavaScript, 404).
      - name: Image de test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-contexts: site=./out
          platforms: linux/amd64
          load: true
          tags: cachety:smoke

      - name: Fumée
        run: |
          docker run -d --rm --name cachety -p 8080:8080 cachety:smoke
          trap 'docker stop cachety >/dev/null' EXIT
          for _ in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          check() { # chemin, statut attendu, type attendu (préfixe)
            read -r status type < <(curl -s -o /dev/null -w '%{http_code} %{content_type}\n' "http://127.0.0.1:8080$1")
            echo "$1 → $status $type"
            [ "$status" = "$2" ] && [[ "$type" == "$3"* ]]
          }
          check / 200 text/html
          check /fr 200 text/html
          check /en/sign 200 text/html
          check /pdfjs/pdf.worker.min.mjs 200 text/javascript
          check /manifest.webmanifest 200 application/manifest+json
          check /cette-page-nexiste-pas 404 text/html
          [ "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8080/fr/)" = "301 http://127.0.0.1:8080/fr" ]

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication (amd64, arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-contexts: site=./out
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
