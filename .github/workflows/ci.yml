# CI : unitaires (sans build ni navigateur), export statique, métadonnées,
# puis suite navigateur (harnais du moteur de filigrane + fumée UI).
# Sur un push vers main, si tout est vert : déploiement sur Cloudflare Pages
# de l'export EXACT qui a été testé (artefact), jamais d'un rebuild.
#
# Navigateurs : playwright-core est une simple bibliothèque (le runner reste
# bun:test) ; `bunx playwright-core install --with-deps <navigateur>` peuple
# son registre (~/.cache/ms-playwright). Sur le runner GitHub, ni CHROMIUM_EXE
# ni /opt/pw-browsers n'existent : e2e/helpers/browser.ts retombe donc sur ce
# registre. Chromium est bloquant ; Firefox et WebKit tournent en matrice non
# bloquante (continue-on-error), la couverture y est identique sauf le test
# presse-papiers, sauté hors Chromium (grantPermissions non supporté).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Audit hebdomadaire : une CVE publiée sur une dépendance doit faire
  # rougir la CI même sans nouveau commit.
  schedule:
    - cron: "0 6 * * 1"
  # Lancement manuel (onglet Actions → CI → Run workflow) : rejoue toute la
  # suite et, sur main, republie le site si la case est cochée. Les tests
  # restent obligatoires : on ne publie jamais un export non testé.
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publier sur cachety.com après les tests (branche main seulement)"
        type: boolean
        default: true

# Moindre privilège : la CI ne fait que lire le dépôt. Les actions tierces
# sont épinglées par SHA de commit (une étiquette peut être déplacée).
permissions:
  contents: read

jobs:
  test:
    name: Unitaires + navigateur (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node épinglé (.nvmrc) : next build tourne sous Node, en même version
      # majeure partout (poste de dev, CI) et alignée sur @types/node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2" # épinglée : même chaîne d'outils partout

      - name: Dépendances
        run: bun install --frozen-lockfile

      - name: Audit des dépendances (CVE connues)
        run: bun audit

      # Avant le build : garantit que `bun test` reste vert sur un arbre nu
      # (les tests de métadonnées se sautent proprement sans out/).
      - name: Tests unitaires
        run: bun test

      # Typage de tout le dépôt (scripts et tests compris), pas seulement de
      # l'application que next build vérifie.
      - name: Typage
        run: bunx tsc --noEmit -p .

      - name: Export statique
        run: bun run build

      - name: Métadonnées et sécurité de l'export (CSP hachée, aucune ressource externe)
        run: bun test ./e2e/site-meta.static.test.ts ./e2e/security.static.test.ts

      - name: Chromium (registre playwright-core)
        run: bunx playwright-core install --with-deps chromium

      - name: Suite navigateur
        run: bun run test:e2e

      # L'export testé ci-dessus, transmis tel quel au job de déploiement.
      - name: Export testé (artefact)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  browsers:
    # WebKit bloquant : c'est le moteur (Safari/iOS) où canvas et pdf.js
    # cassent en premier. Firefox reste indicatif.
    name: Suite navigateur (${{ matrix.browser }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.browser == 'firefox' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node épinglé (.nvmrc) : next build tourne sous Node, en même version
      # majeure partout (poste de dev, CI) et alignée sur @types/node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2" # épinglée : même chaîne d'outils partout

      - name: Dépendances
        run: bun install --frozen-lockfile

      - name: Export statique
        run: bun run build

      - name: Navigateur (registre playwright-core)
        run: bunx playwright-core install --with-deps ${{ matrix.browser }}

      - name: Suite navigateur
        run: bun run test:e2e
        env:
          BROWSER: ${{ matrix.browser }}

  deploy:
    # Un push sur main, ou un lancement manuel sur main (case « Publier »
    # cochée), après les suites bloquantes (Chromium et WebKit). Ni le
    # planning hebdomadaire ni une PR ne déploient.
    name: Déploiement (Cloudflare Pages)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: [test, browsers]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cachety.com
    # Un seul déploiement à la fois ; le plus récent l'emporte.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node épinglé (.nvmrc) : next build tourne sous Node, en même version
      # majeure partout (poste de dev, CI) et alignée sur @types/node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2" # épinglée : même chaîne d'outils partout

      # Wrangler est une devDependency épinglée par le lockfile : pas de
      # téléchargement « latest » au moment de déployer.
      - name: Dépendances
        run: bun install --frozen-lockfile

      - name: Export testé
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out/

      - name: Publication
        run: bunx wrangler pages deploy out --project-name cachety --branch main --commit-hash "$GITHUB_SHA"
        env:
          # Jeton API Cloudflare limité à « Cloudflare Pages : Edit » sur ce compte.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
