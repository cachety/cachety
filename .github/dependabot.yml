# Correctifs de sécurité des dépendances : PR automatiques, revues comme
# n'importe quel changement (la CI audite, teste et rejoue la CSP).
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
