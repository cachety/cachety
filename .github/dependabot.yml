# Correctifs de sécurité des dépendances : PR automatiques, revues comme
# n'importe quel changement (la CI audite, teste et rejoue la CSP).
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Les types suivent la version de Node utilisée (24, épinglée en CI),
      # pas la dernière : une API de Node 26 typée passerait la compilation
      # puis casserait à l'exécution. À relever avec node-version dans ci.yml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Une seule PR pour toutes les actions : elles se testent ensemble.
    groups:
      actions:
        patterns: ["*"]
