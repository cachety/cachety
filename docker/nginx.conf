# Serveur de l'image Docker : usage local (docker run -p 8000:8080 …).
# Le strict nécessaire pour que l'export statique fonctionne ; aucun en-tête
# de sécurité ici. La CSP <meta> de chaque page garde le verrou réseau.
# Exposer Cachety publiquement demande son propre durcissement (out/_headers,
# docs/deploy.md).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Un bloc « types » remplace la table héritée : on la réinclut puis on
    # complète. .mjs doit être du JavaScript, sinon le navigateur refuse le
    # worker pdf.js (module) et aucun PDF ne s'ouvre.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
        application/manifest+json webmanifest;
    }

    # Comme Cloudflare Pages : /fr/ redirige vers /fr. Redirection relative,
    # sinon elle viserait le port du conteneur (8080) au lieu du port publié.
    absolute_redirect off;
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Export Next sans « / » final : /fr → fr.html, /fr/sign → fr/sign.html.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
